services:
  - type: web
    name: cp-coach-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        sync: false # User must provide this in dashboard
      - key: NVIDIA_API_KEY
        sync: false # User must provide this in dashboard
