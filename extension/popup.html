<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg-main: #0B0C0E;
      --bg-surface: #141518;
      --border-color: #232428;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent: #22d3ee;
      --accent-hover: #0891b2;
    }
    
    body {
      width: 320px;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
    }
    
    .header {
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .dashboard-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 10px;
      padding: 2px 6px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      transition: all 0.2s;
    }
    
    .dashboard-link:hover {
      color: var(--accent);
      border-color: var(--accent);
    }
    
    .title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-main);
    }
    
    .content {
      padding: 16px;
    }
    
    .section {
      margin-bottom: 20px;
    }
    
    .section-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    
    input {
      width: 100%;
      box-sizing: border-box;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 10px;
      font-family: monospace;
      font-size: 12px;
      border-radius: 4px;
      outline: none;
    }
    
    input:focus {
      border-color: var(--accent);
    }
    
    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    
    button {
      flex: 1;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 10px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      border-radius: 4px;
      transition: background-color 0.2s, border-color 0.2s;
    }
    
    button:hover {
      border-color: var(--text-muted);
    }
    
    button.primary {
      background-color: rgba(34, 211, 238, 0.1);
      border-color: var(--accent);
      color: var(--accent);
    }
    
    button.primary:hover {
      background-color: rgba(34, 211, 238, 0.2);
    }
    
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      padding: 12px;
      border-radius: 4px;
    }
    
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px dashed var(--border-color);
    }
    
    .prob-id {
      font-family: monospace;
      font-size: 10px;
      color: var(--text-muted);
    }
    
    .prob-rating {
      font-family: monospace;
      font-size: 10px;
      background-color: rgba(255, 255, 255, 0.05);
      padding: 2px 4px;
      border: 1px solid var(--border-color);
    }
    
    .prob-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--accent);
      text-decoration: none;
      display: block;
      margin-bottom: 8px;
    }
    
    .prob-name:hover {
      text-decoration: underline;
    }
    
    .prob-reason {
      font-family: monospace;
      font-size: 11px;
      color: var(--text-muted);
      border-left: 2px solid var(--border-color);
      padding-left: 8px;
      line-height: 1.4;
    }
    
    .status-text {
      font-size: 10px;
      color: var(--text-muted);
      text-align: right;
    }
    
    .empty-state {
      text-align: center;
      padding: 20px 0;
      font-size: 11px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <div class="title">AI CP Coach</div>
      <a href="http://localhost:5173" target="_blank" class="dashboard-link">Open Dashboard ↗</a>
    </div>
    <div class="status-text" id="sync-status">Unsynced</div>
  </div>
  
  <div class="content">
    <div class="section">
      <div class="section-title">Handle Configuration</div>
      <input type="text" id="handle-input" placeholder="Enter CF handle...">
      <div class="btn-row">
        <button id="save-btn">Save</button>
        <button id="sync-btn" class="primary">Sync Now</button>
      </div>
    </div>
    
    <div class="section">
      <div class="section-title" style="display: flex; justify-content: space-between; align-items: center;">
        <span>Recommendation</span>
        <button id="new-pick-btn" style="flex: 0; padding: 2px 6px; font-size: 9px;">New Pick</button>
      </div>
      <div id="rec-container">
        <div class="card empty-state">Set handle and sync to get started.</div>
      </div>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
